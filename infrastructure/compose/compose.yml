services:
  review-api:
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile
    command: >-
      python -m peerassist.review_job_api --data-dir /var/lib/peerassist
      --host 0.0.0.0 --port 8767
    volumes:
      - peerassist-data:/var/lib/peerassist
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8767/api/health', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  workspace:
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile
    command: >-
      python -m peerassist.confirmation_server --run-dir /app/demos/Text/bert
      --paper-id bert --host 0.0.0.0 --port 8766
    environment:
      PEERASSIST_REVIEW_API_URL: http://review-api:8767
      DATA_DIR: /tmp/peerassist-data
    ports:
      - "127.0.0.1:8766:8766"
    depends_on:
      review-api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8766/api/health', timeout=5).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  peerassist-data: {}
