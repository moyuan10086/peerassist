x-platform-environment: &platform-environment
  PEERASSIST_M1_PORT: ${PEERASSIST_M1_PORT:?}
  PEERASSIST_PLATFORM_ENVIRONMENT: development
  PEERASSIST_PLATFORM_PROVIDER_PROFILE: external
  PEERASSIST_PLATFORM_DATABASE_URL: postgresql+psycopg://${PEERASSIST_DB_USER:?}:${PEERASSIST_DB_PASSWORD:?}@postgres:5432/${PEERASSIST_DB_NAME:?}
  PEERASSIST_PLATFORM_OIDC_ISSUER: ${PEERASSIST_PUBLIC_ORIGIN:?}/identity/realms/${PEERASSIST_OIDC_REALM:?}
  PEERASSIST_PLATFORM_IDENTITY_GATEWAY_URL: http://keycloak:8080/identity
  PEERASSIST_PLATFORM_OIDC_AUDIENCE: peerassist-api
  PEERASSIST_PLATFORM_OIDC_CLIENT_ID: ${PEERASSIST_OIDC_CLIENT_ID:?}
  PEERASSIST_PLATFORM_S3_ENDPOINT: http://minio:9000
  PEERASSIST_PLATFORM_S3_BUCKET: ${PEERASSIST_S3_BUCKET:?}
  PEERASSIST_PLATFORM_S3_ACCESS_KEY_ID: ${PEERASSIST_S3_ACCESS_KEY:?}
  PEERASSIST_PLATFORM_S3_SECRET_ACCESS_KEY: ${PEERASSIST_S3_SECRET_KEY:?}
  PEERASSIST_PLATFORM_S3_PATH_STYLE: "true"
  PEERASSIST_PLATFORM_PUBLIC_BASE_URL: ${PEERASSIST_PUBLIC_ORIGIN:?}
  PEERASSIST_PLATFORM_ALLOWED_ORIGINS: '["${PEERASSIST_PUBLIC_ORIGIN:?}"]'
  PEERASSIST_PLATFORM_SESSION_KEY_RING: '["${PEERASSIST_SESSION_KEY:?}"]'
  PEERASSIST_PLATFORM_SCRATCH_ROOT: /var/lib/peerassist/scratch
  PEERASSIST_PLATFORM_INTERNAL_LEGACY_AUDIENCE: peerassist-legacy
  PEERASSIST_PLATFORM_LEGACY_ROOT: /var/lib/peerassist/legacy
  PEERASSIST_MODEL_SETTINGS_PATH: /var/lib/peerassist/model-settings/model-settings.json
  PEERASSIST_MODEL_SETTINGS_FILE_MODE: "0640"

x-service-security: &service-security
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:16.9-bookworm
    user: postgres
    environment:
      POSTGRES_USER: ${PEERASSIST_DB_USER:?}
      POSTGRES_PASSWORD: ${PEERASSIST_DB_PASSWORD:?}
      POSTGRES_DB: ${PEERASSIST_DB_NAME:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:uid=999,gid=999,mode=0770
    <<: *service-security
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -q -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30

  keycloak:
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile.keycloak
    user: "1000:0"
    entrypoint: [/bin/bash, /bootstrap/bootstrap.sh]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${PEERASSIST_KEYCLOAK_ADMIN:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PEERASSIST_KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
      M1_TEST_OIDC_REALM: ${PEERASSIST_OIDC_REALM:?}
      M1_TEST_OIDC_AUTOMATION_CLIENT_ID: ${PEERASSIST_OIDC_AUTOMATION_CLIENT_ID:?}
      M1_TEST_OIDC_AUTOMATION_CLIENT_SECRET: ${PEERASSIST_OIDC_AUTOMATION_CLIENT_SECRET:?}
      M1_TEST_OIDC_PKCE_CLIENT_ID: ${PEERASSIST_OIDC_CLIENT_ID:?}
      M1_TEST_OIDC_USER_PASSWORD: ${PEERASSIST_OIDC_USER_PASSWORD:?}
      M1_TEST_PUBLIC_ORIGIN: ${PEERASSIST_PUBLIC_ORIGIN:?}
      M1_TEST_OIDC_REDIRECT_URI: ${PEERASSIST_PUBLIC_ORIGIN:?}/api/v1/auth/callback
      M1_TEST_IDENTITY_PATH_PREFIX: /identity
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../keycloak/bootstrap.sh:/bootstrap/bootstrap.sh:ro
      - ../keycloak/realm-template.json:/bootstrap/realm-template.json:ro
    tmpfs:
      - /tmp:uid=1000,gid=0,mode=0700
    <<: *service-security
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf "GET /identity/health/ready HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "200 OK" <&3
      interval: 3s
      timeout: 3s
      retries: 40

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    user: "1000:1000"
    command: [server, /data, --address, ":9000"]
    environment:
      MINIO_ROOT_USER: ${PEERASSIST_S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${PEERASSIST_S3_SECRET_KEY:?}
    volumes:
      - minio-data:/data
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    <<: *service-security
    depends_on:
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9000/minio/health/ready]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    user: "0:0"
    entrypoint: [sh, -c]
    command: ["chown -R 1000:1000 /data"]
    volumes:
      - minio-data:/data
    restart: "no"

  minio-bootstrap:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    user: "1000:1000"
    entrypoint: [/bin/sh, /bootstrap/bootstrap.sh]
    environment:
      M1_TEST_S3_ACCESS_KEY: ${PEERASSIST_S3_ACCESS_KEY:?}
      M1_TEST_S3_SECRET_KEY: ${PEERASSIST_S3_SECRET_KEY:?}
      M1_TEST_S3_BUCKET: ${PEERASSIST_S3_BUCKET:?}
      HOME: /home/mc
      MC_CONFIG_DIR: /home/mc/.mc
    volumes:
      - ../minio/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
      - /home/mc:uid=1000,gid=1000,mode=0700
    <<: *service-security
    depends_on:
      minio: {condition: service_healthy}
    restart: "no"

  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile.api
    environment:
      <<: *platform-environment
      PEERASSIST_TEST_DATABASE_URL: postgresql+psycopg://${PEERASSIST_DB_USER:?}:${PEERASSIST_DB_PASSWORD:?}@postgres:5432/${PEERASSIST_DB_NAME:?}
    command: [python, -m, alembic, upgrade, head]
    <<: *service-security
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  platform-bootstrap:
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile.api
    environment:
      <<: *platform-environment
      PEERASSIST_BOOTSTRAP_API_BASE_URL: http://api:${PEERASSIST_M1_PORT:?}
      PEERASSIST_BOOTSTRAP_TOKEN_URL: http://api:${PEERASSIST_M1_PORT:?}/identity/realms/${PEERASSIST_OIDC_REALM:?}/protocol/openid-connect/token
      PEERASSIST_BOOTSTRAP_CLIENT_ID: ${PEERASSIST_OIDC_AUTOMATION_CLIENT_ID:?}
      PEERASSIST_BOOTSTRAP_CLIENT_SECRET: ${PEERASSIST_OIDC_AUTOMATION_CLIENT_SECRET:?}
      PEERASSIST_BOOTSTRAP_USERNAME: ${PEERASSIST_OIDC_USERNAME:?}
      PEERASSIST_BOOTSTRAP_PASSWORD: ${PEERASSIST_OIDC_USER_PASSWORD:?}
      PEERASSIST_BOOTSTRAP_OPERATOR_ID: ${PEERASSIST_BOOTSTRAP_OPERATOR_ID:?}
      PEERASSIST_BOOTSTRAP_ORGANIZATION_SLUG: peerassist
      PEERASSIST_BOOTSTRAP_ORGANIZATION_NAME: PeerAssist
      PEERASSIST_BOOTSTRAP_PROJECT_NAME: ReviewWorkspace
      PEERASSIST_BOOTSTRAP_SCOPE_FILE: /run/peerassist/scope.json
    command: [python, -m, services.bootstrap.main]
    volumes:
      - ${PEERASSIST_BOOTSTRAP_STATE_DIR:?}:/run/peerassist
    <<: *service-security
    depends_on:
      api: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      minio-bootstrap: {condition: service_completed_successfully}
    restart: "no"

  worker-scratch-init:
    image: alpine:3.22.0
    user: "0:0"
    entrypoint: [sh, -c]
    command: ["chown -R 10002:10002 /var/lib/peerassist/scratch"]
    volumes:
      - worker-scratch:/var/lib/peerassist/scratch
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    restart: "no"

  model-settings-init:
    image: alpine:3.22.0
    user: "0:0"
    entrypoint: [sh, -c]
    command: ["chown -R 10001:10001 /var/lib/peerassist/model-settings"]
    volumes:
      - model-settings-data:/var/lib/peerassist/model-settings
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile.api
    environment: *platform-environment
    command: [python, -m, uvicorn, services.api.app:create_configured_app, --factory, --host, 0.0.0.0, --port, "${PEERASSIST_M1_PORT:?}"]
    ports:
      - "${PEERASSIST_M1_PORT:?}:${PEERASSIST_M1_PORT:?}"
    volumes:
      - ${PEERASSIST_LEGACY_ROOT:?}:/var/lib/peerassist/legacy:ro
      - model-settings-data:/var/lib/peerassist/model-settings
    <<: *service-security
    depends_on:
      migrate: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
      minio-bootstrap: {condition: service_completed_successfully}
      model-settings-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; port=os.environ['PEERASSIST_M1_PORT']; urllib.request.urlopen(f'http://127.0.0.1:{port}/api/v1/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile.worker
    environment:
      <<: *platform-environment
      PEERASSIST_WORKER_SCOPE_FILE: /run/peerassist/scope.json
      DATA_DIR: /tmp/peerassist-data
    volumes:
      - worker-scratch:/var/lib/peerassist/scratch
      - model-settings-data:/var/lib/peerassist/model-settings:ro
      - ${PEERASSIST_BOOTSTRAP_STATE_DIR:?}:/run/peerassist:ro
      - ${PEERASSIST_LEGACY_ROOT:?}:/var/lib/peerassist/legacy:ro
    group_add:
      - "10001"
    tmpfs:
      - /tmp:uid=10002,gid=10002,mode=0700
    <<: *service-security
    depends_on:
      platform-bootstrap: {condition: service_completed_successfully}
      worker-scratch-init: {condition: service_completed_successfully}
      model-settings-init: {condition: service_completed_successfully}

volumes:
  postgres-data: {}
  keycloak-data: {}
  minio-data: {}
  worker-scratch: {}
  model-settings-data: {}
