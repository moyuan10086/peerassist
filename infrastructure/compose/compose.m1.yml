x-platform-environment: &platform-environment
  PEERASSIST_PLATFORM_ENVIRONMENT: production
  PEERASSIST_PLATFORM_PROVIDER_PROFILE: external
  PEERASSIST_PLATFORM_DATABASE_URL: postgresql+psycopg://${PEERASSIST_DB_USER:?}:${PEERASSIST_DB_PASSWORD:?}@postgres:5432/${PEERASSIST_DB_NAME:?}
  PEERASSIST_PLATFORM_OIDC_ISSUER: ${PEERASSIST_OIDC_ISSUER:?}
  PEERASSIST_PLATFORM_OIDC_AUDIENCE: peerassist-api
  PEERASSIST_PLATFORM_OIDC_CLIENT_ID: ${PEERASSIST_OIDC_CLIENT_ID:?}
  PEERASSIST_PLATFORM_S3_ENDPOINT: http://minio:9000
  PEERASSIST_PLATFORM_S3_BUCKET: ${PEERASSIST_S3_BUCKET:?}
  PEERASSIST_PLATFORM_S3_ACCESS_KEY_ID: ${PEERASSIST_S3_ACCESS_KEY:?}
  PEERASSIST_PLATFORM_S3_SECRET_ACCESS_KEY: ${PEERASSIST_S3_SECRET_KEY:?}
  PEERASSIST_PLATFORM_S3_PATH_STYLE: "true"
  PEERASSIST_PLATFORM_PUBLIC_BASE_URL: ${PEERASSIST_PUBLIC_ORIGIN:?}
  PEERASSIST_PLATFORM_ALLOWED_ORIGINS: '["${PEERASSIST_PUBLIC_ORIGIN:?}"]'
  PEERASSIST_PLATFORM_SESSION_KEY_RING: '["${PEERASSIST_SESSION_KEY:?}"]'
  PEERASSIST_PLATFORM_INTERNAL_LEGACY_AUDIENCE: peerassist-legacy
  PEERASSIST_PLATFORM_LEGACY_ROOT: /var/lib/peerassist/legacy

x-service-security: &service-security
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:16.9-bookworm
    user: postgres
    environment:
      POSTGRES_USER: ${PEERASSIST_DB_USER:?}
      POSTGRES_PASSWORD: ${PEERASSIST_DB_PASSWORD:?}
      POSTGRES_DB: ${PEERASSIST_DB_NAME:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:uid=999,gid=999,mode=0770
    <<: *service-security
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -q -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    user: "1000:0"
    entrypoint: [/bin/bash, /bootstrap/bootstrap.sh]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${PEERASSIST_KEYCLOAK_ADMIN:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PEERASSIST_KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
      M1_TEST_OIDC_REALM: ${PEERASSIST_OIDC_REALM:?}
      M1_TEST_OIDC_AUTOMATION_CLIENT_ID: ${PEERASSIST_OIDC_AUTOMATION_CLIENT_ID:?}
      M1_TEST_OIDC_AUTOMATION_CLIENT_SECRET: ${PEERASSIST_OIDC_AUTOMATION_CLIENT_SECRET:?}
      M1_TEST_OIDC_PKCE_CLIENT_ID: ${PEERASSIST_OIDC_CLIENT_ID:?}
      M1_TEST_OIDC_USER_PASSWORD: ${PEERASSIST_OIDC_USER_PASSWORD:?}
      M1_TEST_PUBLIC_ORIGIN: ${PEERASSIST_PUBLIC_ORIGIN:?}
      M1_TEST_OIDC_REDIRECT_URI: ${PEERASSIST_PUBLIC_ORIGIN:?}/api/v1/auth/callback
    volumes:
      - ../keycloak/bootstrap.sh:/bootstrap/bootstrap.sh:ro
      - ../keycloak/realm-template.json:/bootstrap/realm-template.json:ro
    tmpfs:
      - /tmp:uid=1000,gid=0,mode=0700
      - /opt/keycloak/data:uid=1000,gid=0,mode=0700
    <<: *service-security

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    user: "1000:1000"
    command: [server, /data, --address, ":9000"]
    environment:
      MINIO_ROOT_USER: ${PEERASSIST_S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${PEERASSIST_S3_SECRET_KEY:?}
    volumes:
      - minio-data:/data
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    <<: *service-security
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9000/minio/health/ready]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-bootstrap:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    user: "1000:1000"
    entrypoint: [/bin/sh, /bootstrap/bootstrap.sh]
    environment:
      M1_TEST_S3_ACCESS_KEY: ${PEERASSIST_S3_ACCESS_KEY:?}
      M1_TEST_S3_SECRET_KEY: ${PEERASSIST_S3_SECRET_KEY:?}
      M1_TEST_S3_BUCKET: ${PEERASSIST_S3_BUCKET:?}
    volumes:
      - ../minio/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
      - /home/mc:uid=1000,gid=1000,mode=0700
    <<: *service-security
    depends_on:
      minio: {condition: service_healthy}
    restart: "no"

  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile.api
    environment: *platform-environment
    command: [python, -m, alembic, upgrade, head]
    <<: *service-security
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  platform-bootstrap:
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile.api
    environment: *platform-environment
    command: [python, -c, "from common.config import PlatformSettings; PlatformSettings(); print('platform configuration ready')"]
    <<: *service-security
    depends_on:
      migrate: {condition: service_completed_successfully}
      keycloak: {condition: service_started}
      minio-bootstrap: {condition: service_completed_successfully}
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile.api
    environment: *platform-environment
    ports:
      - "127.0.0.1:${PEERASSIST_M1_PORT:-8080}:8080"
    <<: *service-security
    depends_on:
      migrate: {condition: service_completed_successfully}
      platform-bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile.worker
    environment:
      <<: *platform-environment
      PEERASSIST_WORKER_ORGANIZATION_ID: ${PEERASSIST_WORKER_ORGANIZATION_ID:?}
      PEERASSIST_WORKER_PROJECT_ID: ${PEERASSIST_WORKER_PROJECT_ID:?}
    volumes:
      - worker-scratch:/var/lib/peerassist/scratch
      - ${PEERASSIST_LEGACY_ROOT:?}:/var/lib/peerassist/legacy:ro
    tmpfs:
      - /tmp:uid=10002,gid=10002,mode=0700
    <<: *service-security
    depends_on:
      platform-bootstrap: {condition: service_completed_successfully}

volumes:
  postgres-data: {}
  minio-data: {}
  worker-scratch: {}
