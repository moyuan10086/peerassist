# PeerAssist split frontend/backend reverse proxy.
# Replace peerassist.example.com and peerassist-api.example.com with real DNS names
# after the domain A records point to 101.47.158.17.

upstream peerassist_backend {
    server 127.0.0.1:8766;
    keepalive 32;
}

server {
    listen 80;
    server_name peerassist.example.com review.peerassist.example.com;

    location / {
        proxy_pass http://peerassist_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://peerassist_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /paper.pdf {
        proxy_pass http://peerassist_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.peerassist.example.com peerassist-api.example.com;

    location / {
        proxy_pass http://peerassist_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
